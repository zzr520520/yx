name: Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Compile dylib
      run: |
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK: $SDK"
        clang -arch arm64 \
          -isysroot "$SDK" \
          -mios-version-min=14.0 \
          -fobjc-arc \
          -fmodules \
          -dynamiclib \
          -o Inject.dylib \
          Inject.m \
          -framework UIKit \
          -framework Foundation \
          -framework Security
        echo "=== 验证 dylib 架构 ==="
        file Inject.dylib
        lipo -info Inject.dylib
        echo "=== 验证导出符号 ==="
        nm -g Inject.dylib | head -20

    - name: Upload dylib artifact
      uses: actions/upload-artifact@v4
      with:
        name: Inject.dylib
        path: Inject.dylib
