name: Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download SSZipArchive source
      run: |
        git clone --depth 1 https://github.com/ZipArchive/ZipArchive.git /tmp/sszip
        # 复制源码到项目目录
        cp -r /tmp/sszip/SSZipArchive ./SSZipArchive
        echo "=== SSZipArchive 文件结构 ==="
        find ./SSZipArchive -name "*.m" -o -name "*.c" -o -name "*.h" | head -30

    - name: Compile dylib
      run: |
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK: $SDK"

        # 获取所有 SSZipArchive 源文件
        SSZIP_SOURCES=$(find SSZipArchive -name "*.m" -o -name "*.c" | tr '\n' ' ')
        echo "SSZipArchive sources: $SSZIP_SOURCES"

        clang -arch arm64 \
          -isysroot "$SDK" \
          -mios-version-min=14.0 \
          -fobjc-arc \
          -fmodules \
          -DHAVE_ZLIB -DZLIB_COMPAT \
          -dynamiclib \
          -o Inject.dylib \
          Inject.m \
          $SSZIP_SOURCES \
          -ISSZipArchive \
          -ISSZipArchive/minizip \
          -framework UIKit \
          -framework Foundation \
          -framework Security \
          -lz \
          -Wno-deprecated-declarations \
          -Wno-unused-variable \
          -Wno-unused-function

        echo "=== 验证 dylib ==="
        file Inject.dylib
        lipo -info Inject.dylib
        echo "=== 导出符号 ==="
        nm -g Inject.dylib | grep -i "injector\|sszip" | head -20

    - name: Upload dylib artifact
      uses: actions/upload-artifact@v4
      with:
        name: Inject.dylib
        path: Inject.dylib
