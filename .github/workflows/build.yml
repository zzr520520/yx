name: Build DeviceSpoofPro deb

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  THEOS: /Users/runner/theos

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Cache Theos
      id: cache-theos
      uses: actions/cache@v4
      with:
        path: /Users/runner/theos
        key: theos-macos-v1

    - name: Install Theos
      if: steps.cache-theos.outputs.cache-hit != 'true'
      run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

    - name: Verify Theos & Install ldid
      run: |
        if [ ! -f "$THEOS/makefiles/common.mk" ]; then
          rm -rf "$THEOS"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
        fi
        command -v ldid || brew install ldid

    - name: Build package
      run: |
        make clean || true
        make package FINALPACKAGE=1 messages=yes

    - name: Inject postinst script (uicache + killall)
      run: |
        cd packages
        DEB=$(ls *.deb | head -1)
        echo "Processing: $DEB"
        python3 ../scripts/inject_postinst.py "$DEB" ../scripts/postinst
        echo "=== Final deb contents ==="
        ar t "$DEB"

    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: DeviceSpoofPro-deb
        path: packages/*.deb
