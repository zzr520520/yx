name: Build DeviceSpoofPro deb

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  THEOS: /Users/runner/theos

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Cache Theos
      id: cache-theos
      uses: actions/cache@v4
      with:
        path: /Users/runner/theos
        key: theos-macos-v1

    - name: Install Theos
      if: steps.cache-theos.outputs.cache-hit != 'true'
      run: |
        bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

    - name: Verify Theos & Install ldid
      run: |
        if [ ! -f "$THEOS/makefiles/common.mk" ]; then
          echo "Theos incomplete, re-installing..."
          rm -rf "$THEOS"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
        fi
        if ! command -v ldid &> /dev/null; then
          echo "ldid not found, installing via brew..."
          brew install ldid
        fi
        echo "=== ldid version ==="
        ldid || true
        echo "=== Theos SDKs ==="
        ls "$THEOS/sdks/" || true

    - name: Build package
      run: |
        make clean || true
        make package FINALPACKAGE=1 messages=yes

    - name: Add postinst script (uicache + killall)
      run: |
        brew install dpkg
        cd packages
        DEB=$(ls *.deb | head -1)
        echo "Processing: $DEB"
        rm -rf extracted
        dpkg-deb -R "$DEB" extracted
        cat > extracted/DEBIAN/postinst << 'POSTINST'
#!/bin/bash
echo "[DeviceSpoofPro] Running uicache to register app icon..."
if command -v uicache &>/dev/null; then
  uicache
elif [ -x /var/jb/usr/bin/uicache ]; then
  /var/jb/usr/bin/uicache
elif [ -x /usr/bin/uicache ]; then
  /usr/bin/uicache
fi
echo "[DeviceSpoofPro] Restarting SpringBoard..."
killall -9 SpringBoard 2>/dev/null || true
exit 0
POSTINST
        chmod 755 extracted/DEBIAN/postinst
        dpkg-deb -b extracted "$DEB"
        rm -rf extracted
        echo "=== Final deb contents ==="
        dpkg-deb -c "$DEB"

    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: DeviceSpoofPro-deb
        path: packages/*.deb
